# Originally auto-generated by the Firebase CLI, then edited by hand.
# https://github.com/firebase/firebase-tools
#
# DO NOT re-add a build step. This is a static site with no build: there is no
# package.json, no bundler and no npm dependencies — `public/` is deployed
# exactly as it sits in the repo (firebase.json sets hosting.public: "public",
# and the Firebase JS SDK arrives over a CDN import map in public/index.html).
# The CLI's stock `npm ci && npm run build` line failed this job on every push.
#
# NOTE: this workflow deploys channelId: live on every push to main, with no
# manual approval gate. A push to main IS a production deploy.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TODO_MANAGER_1F96E }}
          channelId: live
          projectId: todo-manager-1f96e
