# Originally auto-generated by the Firebase CLI, then edited by hand.
# https://github.com/firebase/firebase-tools
#
# DO NOT re-add a build step — see the note in firebase-hosting-merge.yml.
# This is a static site with no package.json; the CLI's stock
# `npm ci && npm run build` line failed this job on every pull request.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TODO_MANAGER_1F96E }}
          projectId: todo-manager-1f96e
