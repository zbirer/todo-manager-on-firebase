<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Manager</title>

  <!-- Import Map for Firebase v11+ ESM -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js"
      }
    }
  </script>

  <!-- Clean, modern styling -->
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9fafb;
      color: #1f2937;
    }
    h1 {
      color: #111827;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    #login-btn {
      background-color: #4285f4;
      color: white;
    }
    #logout-btn {
      background-color: #ef4444;
      color: white;
    }
    input {
      width: 70%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }
    #task-form button {
      background-color: #3b82f6;
      color: white;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    .show-completed-toggle {
      display: block;
      margin: 16px 0 4px;
      font-size: 14px;
      color: #374151;
    }
    /* Per-task color still comes from the stored `colors` field (set inline
       by render.js); everything else about a row's look lives here.
       flex-wrap lets the note row (flex-basis: 100%, below) drop onto its
       own line under the checkbox+title row instead of squeezing into it. */
    li.task-item {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      margin: 5px 0;
      /* Depth comes from taskTree.js's depthOf, set as a custom property by
         render.js (li.style.setProperty("--depth", depth)) — this is the
         only place the number becomes a visual indent. */
      margin-left: calc(var(--depth, 0) * 24px);
      border-radius: 4px;
      font-family: sans-serif;
    }
    .task-item--completed .task-item__label {
      text-decoration: line-through;
      opacity: 0.7;
    }
    .task-item__label {
      cursor: text;
    }
    .task-item__title-input {
      flex: 1;
      min-width: 120px;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
    }
    /* Note row always spans the full width, indented to sit under the title
       rather than the checkbox. */
    .task-item__note-display,
    .task-item__note-input {
      flex-basis: 100%;
      margin-left: 28px;
      font-size: 13px;
    }
    .task-item__note-display {
      cursor: text;
      white-space: pre-wrap;
      opacity: 0.9;
    }
    .task-item__note-display a {
      color: inherit;
      text-decoration: underline;
    }
    .task-item__note-placeholder {
      font-style: italic;
      opacity: 0.6;
    }
    .task-item__note-input {
      width: calc(100% - 28px);
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      font-family: inherit;
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
      resize: vertical;
    }
    /* All per-row action buttons live in one wrapper so pushing the whole
       group to the right (margin-left: auto) never depends on which
       individual buttons happen to be visible — render.js toggles buttons
       inside this wrapper independently (e.g. move-out-of-inbox only shows
       for Inbox rows) without CSS having to know which one is "first". */
    .task-item__actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    /* Stand-ins for the task menu (long-press/right-click) that step 8 adds. */
    .task-item__add-subtask-btn,
    .task-item__delete-btn,
    .task-item__move-out-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: rgba(0, 0, 0, 0.25);
      color: inherit;
    }
    #inbox-section h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    #inbox-section {
      padding-bottom: 8px;
      border-bottom: 1px solid #d1d5db;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>Todo Manager</h1>
  
  <div id="auth-section">
    <p id="user-status">Checking status...</p>
    <button id="login-btn" style="display: none;">Login with Google</button>
    <button id="logout-btn" style="display: none;">Logout</button>
  </div>

  <!-- Interactive task UI section -->
  <div id="task-section" style="display: none; margin-top: 20px;">
    <form id="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="Add task (e.g., Buy groceries #food @shop)"
        required
      />
      <button type="submit">Add Task</button>
    </form>
    <label class="show-completed-toggle">
      <input type="checkbox" id="show-completed-toggle" />
      Show completed
    </label>

    <!-- Step 5: a real container, not a computed view — a task sits here
         until an explicit move files it into the list below. Shown first
         since every new capture lands here by default (product-spec.md's
         Inbox section). -->
    <section id="inbox-section">
      <h2>Inbox</h2>
      <ul id="inbox-list"></ul>
    </section>

    <h2>My Tasks</h2>
    <ul id="task-list"></ul>
  </div>

  <!-- Pointing to our main orchestration file -->
  <script type="module" src="./app.js"></script>
</body>
</html>
