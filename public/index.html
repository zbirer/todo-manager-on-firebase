<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Manager</title>

  <!-- Import Map for Firebase v11+ ESM -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js"
      }
    }
  </script>

  <!-- Clean, modern styling -->
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9fafb;
      color: #1f2937;
    }
    h1 {
      color: #111827;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    #login-btn {
      background-color: #4285f4;
      color: white;
    }
    #logout-btn {
      background-color: #ef4444;
      color: white;
    }
    input {
      width: 70%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }
    #task-form button {
      background-color: #3b82f6;
      color: white;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    .show-completed-toggle {
      display: block;
      margin: 16px 0 4px;
      font-size: 14px;
      color: #374151;
    }
    /* Step 14 (D3): the colors below are the DEFAULT row style — what a task
       with no colored tag looks like. render.js resolves the winning tag's
       colors per render and sets them inline on the <li>, overriding these;
       when no tag wins it CLEARS those inline properties rather than writing a
       hardcoded pair, so this rule is the single owner of the default look.
       (Before step 14 these same two values were the fallback hardcoded in
       render.js, read off a stored per-task `colors` field that nothing reads
       anymore.)
       flex-wrap lets the note row (flex-basis: 100%, below) drop onto its
       own line under the checkbox+title row instead of squeezing into it. */
    li.task-item {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      margin: 5px 0;
      color: #ffffff;
      background-color: #3b82f6;
      /* Depth comes from taskTree.js's depthOf, set as a custom property by
         render.js (li.style.setProperty("--depth", depth)) — this is the
         only place the number becomes a visual indent. */
      margin-left: calc(var(--depth, 0) * 24px);
      border-radius: 4px;
      font-family: sans-serif;
    }
    .task-item--completed .task-item__label {
      text-decoration: line-through;
      opacity: 0.7;
    }
    .task-item__label {
      cursor: text;
    }
    .task-item__title-input {
      flex: 1;
      min-width: 120px;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
    }
    /* Note row always spans the full width, indented to sit under the title
       rather than the checkbox. */
    .task-item__note-display,
    .task-item__note-input {
      flex-basis: 100%;
      margin-left: 28px;
      font-size: 13px;
    }
    .task-item__note-display {
      cursor: text;
      white-space: pre-wrap;
      opacity: 0.9;
    }
    .task-item__note-display a {
      color: inherit;
      text-decoration: underline;
    }
    .task-item__note-placeholder {
      font-style: italic;
      opacity: 0.6;
    }
    .task-item__note-input {
      width: calc(100% - 28px);
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      font-family: inherit;
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
      resize: vertical;
    }
    /* Step 13 (Dates): the due-date + age row, same full-width/indented
       pattern as the note row above, one line below it. */
    .task-item__meta {
      flex-basis: 100%;
      margin-left: 28px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      opacity: 0.85;
    }
    .task-item__due-display {
      cursor: text;
    }
    /* D3: overdue is a distinct, attention-getting state — never applied to
       a task due today or in the future (isOverdueTask, render.js). */
    .task-item__due-display--overdue {
      color: #fca5a5;
      font-weight: 600;
    }
    .task-item__due-input {
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
    }
    .task-item__age {
      opacity: 0.75;
    }
    /* Step 15 (Q6): the resolved-quadrant badge — compact by design, the full
       wording lives in its `title` attribute (a native tooltip on hover), not
       in this pill's text. Sits in the same flex-wrap meta row as due-date/age
       so it never disturbs an RTL title above it; hidden entirely (display:
       none, set in render.js) for an unranked task rather than shown empty. */
    .task-item__quadrant-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background-color: rgba(255, 255, 255, 0.25);
    }
    /* Step 18 (Recurrence): same compact-pill shape as the quadrant badge
       just above, in the same meta row; hidden entirely (display: none, set
       in render.js) for a non-recurring task rather than shown empty. */
    .task-item__recurrence-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background-color: rgba(255, 255, 255, 0.25);
    }
    /* All per-row action buttons live in one wrapper so pushing the whole
       group to the right (margin-left: auto) never depends on which
       individual buttons happen to be visible — render.js toggles buttons
       inside this wrapper independently (e.g. move-out-of-inbox only shows
       for Inbox rows) without CSS having to know which one is "first". */
    .task-item__actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }
    /* Always-visible per-row actions. Step 8 added a right-click/long-press
       context menu (.task-menu below) that reaches the same commands, but
       these inline buttons stay too — the menu is an additional way in, not
       a replacement for them. */
    .task-item__add-subtask-btn,
    .task-item__delete-btn,
    .task-item__move-out-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: rgba(0, 0, 0, 0.25);
      color: inherit;
    }
    #inbox-section h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    #inbox-section {
      padding-bottom: 8px;
      border-bottom: 1px solid #d1d5db;
      margin-bottom: 8px;
    }
    /* Step 12: Focus — pinned tasks, flat (render.js's renderTasks flat
       branch), sitting above Inbox/main (D8: it's the "what am I working on
       now" view). `hidden` (toggled by app.js's renderMainView) means no
       empty heading takes up space when nothing is pinned. Rows reuse the
       exact same .task-item markup/styling as the main list — a pinned row
       looks identical whether you're looking at its Focus copy or its
       normal-place copy. */
    #focus-section h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    #focus-section {
      padding-bottom: 8px;
      border-bottom: 1px solid #d1d5db;
      margin-bottom: 8px;
    }
    /* Step 8: the task context menu — one element for the whole app, moved
       and re-labeled per open rather than rebuilt. It lives outside both
       <ul>s (it's a sibling of #task-section entirely) so render.js's keyed
       re-render, which only ever touches li's inside those lists, can never
       tear it down while it's open. `display: none` is the resting state;
       `:not([hidden])` promotes it to flex only while app.js has it open,
       since a bare `.task-menu { display: flex }` would tie in specificity
       with the browser's own `[hidden] { display: none }` rule and could
       lose depending on stylesheet order. */
    .task-menu {
      position: fixed;
      display: none;
      flex-direction: column;
      min-width: 170px;
      background-color: #1f2937;
      color: #f9fafb;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      padding: 4px;
      z-index: 1000;
    }
    .task-menu:not([hidden]) {
      display: flex;
    }
    .task-menu__item {
      background: none;
      border: none;
      color: inherit;
      text-align: left;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    .task-menu__item:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }
    .task-menu__item--danger {
      color: #fca5a5;
    }
    /* Step 10: the per-row drag handle. `touch-action: none` is load-bearing,
       not decorative — without it, a touch device's own scroll gesture can
       win the pointer sequence away from our pointermove handler before a
       drag ever gets a chance to start (see render.js's createTaskElement
       comment). */
    .task-item__drag-handle {
      cursor: grab;
      touch-action: none;
      padding: 0 4px;
      font-size: 16px;
      line-height: 1;
      user-select: none;
      opacity: 0.7;
    }
    .task-item__drag-handle:active {
      cursor: grabbing;
    }
    /* The shared drop-indicator line (app.js creates and moves ONE instance
       of this, the same "single element, moved not rebuilt" pattern as
       .task-menu above) — `pointer-events: none` so it can never itself
       become the element under the pointer mid-drag and confuse the
       sibling-vs-indicator check in app.js's updateDragTarget. */
    .drop-indicator {
      height: 3px;
      margin: 2px 0;
      background-color: #3b82f6;
      border-radius: 2px;
      list-style: none;
      pointer-events: none;
    }
    /* Step 16 (R5): this exact gap crosses a quadrant-rank boundary — still a
       real, droppable target (the write still lands on release), but it will
       NOT visually hold once priority order re-sorts the list. Styled with
       the same orange product-spec.md's "make an overruled action visible"
       language already uses for .task-item--reparent-target below, dashed
       rather than solid so "will not hold" reads differently from the plain
       blue line even at a glance, before the user ever releases. */
    .drop-indicator--overruled {
      background-color: transparent;
      background-image: repeating-linear-gradient(90deg, #f59e0b 0 8px, transparent 8px 14px);
      border-radius: 0;
    }
    /* Step 11: the reparent target highlight. `drop-indicator` above marks an
       INSERTION POINT between two rows (a line); this marks a ROW ITSELF as
       "drop here to become my child" (D2's middle-50%-of-the-row zone), so it
       has to look different from the line, not reuse it. `outline` (not
       `border`) so it never shifts the row's own layout/height the way a
       border would, which would itself change where the 25/50/25 zone
       boundaries fall on the very next pointermove. */
    .task-item--reparent-target {
      outline: 3px solid #f59e0b;
      outline-offset: -3px;
    }
    /* Step 9: the Trash view. Reuses the app's existing color language
       (danger red for the destructive framing) rather than inventing a new
       one. */
    #trash-view h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    #trash-count {
      font-size: 13px;
      color: #6b7280;
      margin: 4px 0 12px;
    }
    li.trash-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      background-color: #e5e7eb;
      color: #1f2937;
    }
    .trash-item__label {
      flex: 1;
      word-break: break-word;
    }
    .trash-item__restore-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #3b82f6;
      color: white;
      flex-shrink: 0;
    }
    #trash-btn {
      background-color: #6b7280;
      color: white;
      margin: 8px 0;
    }
    #trash-back-btn {
      background-color: #6b7280;
      color: white;
      margin-bottom: 8px;
    }
    /* Step 13 (Dates, D4): the Overdue screen — a third view panel, styled
       like Trash's (same button color language) since it's the same kind of
       "step out of the main view into a dedicated screen" pattern. */
    #overdue-view h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    #overdue-count {
      font-size: 13px;
      color: #6b7280;
      margin: 4px 0 12px;
    }
    #overdue-btn {
      background-color: #b45309;
      color: white;
      margin: 8px 0;
    }
    #overdue-back-btn {
      background-color: #6b7280;
      color: white;
      margin-bottom: 8px;
    }
    /* Step 14 (Tag colors, D4): the Tag Settings screen — a fourth view panel,
       styled like Trash's and Overdue's for the same reason they match each
       other: it is the same "step out of the main view into a dedicated
       screen" pattern, not a new one. Step 15 adds a quadrant control to each
       row here; the row is a flex line precisely so that is one more child,
       not a re-layout. */
    #settings-view h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    #settings-count {
      font-size: 13px;
      color: #6b7280;
      margin: 4px 0 12px;
    }
    #settings-btn {
      background-color: #4b5563;
      color: white;
      margin: 8px 0;
    }
    #settings-back-btn {
      background-color: #6b7280;
      color: white;
      margin-bottom: 8px;
    }
    /* Step 17: the single in-memory undo affordance — an amber warning color
       (distinct from every other button here) so it reads as "time-limited",
       matching its own honest "lost on reload" label. */
    #settings-undo-btn {
      display: block;
      background-color: #b45309;
      color: white;
      font-size: 13px;
      padding: 6px 10px;
      margin: 0 0 12px;
    }
    li.tag-setting {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      background-color: #e5e7eb;
      color: #1f2937;
    }
    /* The tag rendered in its own assigned colors — the row's preview, so the
       pair is visible here without hunting for a task that carries the tag.
       render.js sets color/background inline when the tag HAS colors; the
       --unset modifier below is what an uncolored tag looks like instead. */
    .tag-setting__preview {
      flex: 1;
      min-width: 90px;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-word;
    }
    .tag-setting__preview--unset {
      border: 1px dashed #9ca3af;
      opacity: 0.75;
    }
    .tag-setting__field {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #374151;
    }
    /* `input` above is styled at 70% width for the add-task box; a color swatch
       has to opt out of that or it takes the whole row. */
    .tag-setting__color {
      width: 36px;
      height: 26px;
      padding: 0;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      background: none;
      cursor: pointer;
    }
    .tag-setting__clear-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #6b7280;
      color: white;
      flex-shrink: 0;
    }
    /* Step 15: the quadrant <select>, one more field in the same flex row —
       PROGRESS.md's own note on this being "one more child, not a rewrite". */
    .tag-setting__quadrant {
      font-size: 12px;
      padding: 3px 4px;
      border-radius: 4px;
      border: 1px solid #9ca3af;
      background-color: white;
      color: #1f2937;
    }
    /* Step 17: Rename/Delete — two separate destructive-ish actions (see
       render.js's comment on why they're not one toggle), styled apart from
       "Clear colors" (which only ever touches colors, never the tag itself)
       so the two very different blast radii read differently at a glance. */
    .tag-setting__rename-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #2563eb;
      color: white;
      flex-shrink: 0;
    }
    .tag-setting__delete-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #b91c1c;
      color: white;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>Todo Manager</h1>
  
  <div id="auth-section">
    <p id="user-status">Checking status...</p>
    <button id="login-btn" style="display: none;">Login with Google</button>
    <button id="logout-btn" style="display: none;">Logout</button>
  </div>

  <!-- Interactive task UI section. Step 9 splits this into two mutually
       exclusive panels — #main-view and #trash-view — switched by app.js's
       `currentView` string and `views` dispatch object. This is deliberately
       NOT a router (no hash change, no history entry): the plan calls for
       "a currentView string plus that dispatch object", nothing more, since
       the app has exactly two screens and no need for back/forward or a
       bookmarkable URL per screen. -->
  <div id="task-section" style="display: none; margin-top: 20px;">
    <div id="main-view">
      <form id="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="Add task (e.g., Buy groceries #food @shop)"
          required
        />
        <button type="submit">Add Task</button>
      </form>
      <label class="show-completed-toggle">
        <input type="checkbox" id="show-completed-toggle" />
        Show completed
      </label>
      <button type="button" id="trash-btn">Trash</button>
      <!-- Step 13 (D1/D4): opens the Overdue screen — see #overdue-view
           below for why this is a separate VIEW (Trash's precedent), not a
           section folded into this main view the way Focus is. -->
      <button type="button" id="overdue-btn">Overdue</button>
      <!-- Step 14 (D4): opens the Tag Settings screen — see #settings-view
           below. Step 15's quadrant mapping shares this same screen. -->
      <button type="button" id="settings-btn">Tag settings</button>

      <!-- Step 12 (D1/D8): Focus — pinned tasks, hand-picked (D2: flat, no
           subtree pulled in), sorted by the same comparator as the main list
           (D3). `hidden` by default; app.js's renderMainView toggles it based
           on whether anything is pinned, so an empty Focus never shows an
           empty heading above the Inbox. Sits ABOVE the Inbox — it's the
           "what am I working on right now" view, per the spec. -->
      <section id="focus-section" hidden>
        <h2>Focus</h2>
        <ul id="focus-list"></ul>
      </section>

      <!-- Step 5: a real container, not a computed view — a task sits here
           until an explicit move files it into the list below. Shown first
           since every new capture lands here by default (product-spec.md's
           Inbox section). -->
      <section id="inbox-section">
        <h2>Inbox</h2>
        <ul id="inbox-list"></ul>
      </section>

      <h2>My Tasks</h2>
      <ul id="task-list"></ul>
    </div>

    <!-- Step 9: the Trash — a FLAT list ordered newest-deleted-first (never
         a tree; see render.js's renderTrash comment for why), with a count
         against the 50-item cap and a per-row Restore button. Nested inside
         #task-section (not a sibling of it) so it shares that element's
         existing delegated listeners instead of needing its own set — a
         trash row's <li> carries `dataset.taskId` just like a main-list row,
         so app.js's click delegation can recognize `.trash-item__restore-btn`
         the same way it recognizes the main list's per-row buttons. -->
    <div id="trash-view" hidden>
      <button type="button" id="trash-back-btn">← Back</button>
      <h2>Trash</h2>
      <p id="trash-count"></p>
      <ul id="trash-list"></ul>
    </div>

    <!-- Step 13 (D1/D4): the Overdue screen — a SCREEN following #trash-view's
         exact precedent above (a currentView value + app.js's dispatch
         table), deliberately NOT a section folded into #main-view the way
         #focus-section is. Rows are flat and full-width (render.js's
         renderOverdue reuses the exact same createTaskElement/
         updateTaskElement pipeline the main list and Focus use — checkbox,
         title/note/due-date inline edit, drag handle, buttons — never
         #trash-view's simpler label-plus-button shape), never a tree, and
         never pull in a non-overdue parent or child (D4). Nested inside
         #task-section for the same reason #trash-view is: sharing its
         existing delegated listeners instead of needing a second set. -->
    <div id="overdue-view" hidden>
      <button type="button" id="overdue-back-btn">← Back</button>
      <h2>Overdue</h2>
      <p id="overdue-count"></p>
      <ul id="overdue-list"></ul>
    </div>

    <!-- Step 14 (D4): the Tag Settings screen — a SCREEN following
         #trash-view/#overdue-view's exact precedent (a currentView value +
         app.js's dispatch table), deliberately not a fourth navigation
         pattern. Rows are keyed by TAG NAME (`data-tag-name`), not task id:
         a tag is not a task, so these rows share none of the task row's shape
         (no checkbox, no inline title/note/due editor, no drag handle, no
         depth). Nested inside #task-section for the same reason the other two
         screens are — it reaches app.js's existing delegated change/click
         listeners instead of needing its own set. Per product-spec.md §7 this
         is also where step 15's quadrant assignment lands: one screen owns
         everything about a tag. -->
    <div id="settings-view" hidden>
      <button type="button" id="settings-back-btn">← Back</button>
      <h2>Tag settings</h2>
      <p id="settings-count"></p>
      <!-- Step 17 (S17-1): a single in-memory undo slot for the last tag
           rename/delete — hidden whenever nothing is undoable. Its own label
           says "lost on reload" so the affordance never implies a durable
           history this app doesn't have (there is no operation log; this is
           scoped to exactly this one action per PROGRESS.md's Decisions). -->
      <button type="button" id="settings-undo-btn" hidden></button>
      <ul id="settings-list"></ul>
    </div>
  </div>

  <!-- Step 8: the task context menu (right-click or long-press on a row).
       Deliberately OUTSIDE #task-section's lists — see the .task-menu CSS
       comment above for why. `data-task-id` is set by app.js when it opens;
       "Move out of Inbox" is shown/hidden per task at open time (only an
       Inbox row has anything to file). All three items route to the exact
       same handler functions the existing inline per-row buttons call —
       there is no separate menu-only implementation of any of these. -->
  <div id="task-menu" class="task-menu" hidden>
    <button type="button" class="task-menu__item" data-action="add-subtask">Add subtask</button>
    <button type="button" class="task-menu__item" data-action="move-out">Move out of Inbox</button>
    <!-- Step 11 (D9): the promote-to-root move drag can't express — there is
         no row to drop a task onto for "no parent". Shown only for a task
         that currently HAS a parent (app.js's openTaskMenuForTask toggles
         this the same way it already toggles "Move out of Inbox"). Routes
         through the exact same reparent handler the drag-drop path uses
         (performReparent in app.js), not a parallel implementation. -->
    <button type="button" class="task-menu__item" data-action="move-to-top">Move to top level</button>
    <!-- Step 12 (D7): pin/unpin a task into Focus — context-menu only, no
         inline per-row button, same pattern as "Move to top level" above.
         Label text and hidden/shown state are set per-open by app.js's
         openTaskMenuForTask (hidden for a completed task — only an open task
         can be "what I'm working on now"). Routes through the one shared
         handleTogglePinClick/enqueueMutation-wrapped saveTask, not a
         parallel implementation. -->
    <button type="button" class="task-menu__item" data-action="toggle-pin">Pin to Focus</button>
    <!-- Step 13 (D10): "Set due date"/"Change due date" opens the inline
         `<input type="date">` editor on the row the menu was opened for
         (app.js's openTaskMenuForTask sets both the label and
         taskMenu.dataset.context per open). "Clear due date" is a one-shot
         write with no editor step, shown only when task.dueDate is set. -->
    <button type="button" class="task-menu__item" data-action="edit-due-date">Set due date</button>
    <button type="button" class="task-menu__item" data-action="clear-due-date">Clear due date</button>
    <!-- Step 18 (Recurrence, S18-0/D10 precedent): a single prompt-based
         editor (app.js's handleSetRecurrenceClick), label toggled per
         whether a rule is already set. There is deliberately NO separate
         "Stop recurrence" item — product-spec.md §5:145-148 rules that out
         explicitly (deleting the task is what ends a cycle); the editor's
         own "none" answer is how a misconfigured rule gets corrected. -->
    <button type="button" class="task-menu__item" data-action="set-recurrence">Set recurrence</button>
    <button type="button" class="task-menu__item task-menu__item--danger" data-action="delete">Delete</button>
  </div>

  <!-- Pointing to our main orchestration file -->
  <script type="module" src="./app.js"></script>
</body>
</html>
