<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Manager</title>

  <!-- Import Map for Firebase v11+ ESM -->
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.3.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.3.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.3.0/firebase-firestore.js"
      }
    }
  </script>

  <!-- Clean, modern styling -->
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9fafb;
      color: #1f2937;
    }
    h1 {
      color: #111827;
    }
    button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    #login-btn {
      background-color: #4285f4;
      color: white;
    }
    #logout-btn {
      background-color: #ef4444;
      color: white;
    }
    input {
      width: 70%;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      font-size: 14px;
    }
    input:focus {
      outline: 2px solid #3b82f6;
      border-color: transparent;
    }
    #task-form button {
      background-color: #3b82f6;
      color: white;
    }
    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    .show-completed-toggle {
      display: block;
      margin: 16px 0 4px;
      font-size: 14px;
      color: #374151;
    }
    /* Step 14 (D3): the colors below are the DEFAULT row style — what a task
       with no colored tag looks like. render.js resolves the winning tag's
       colors per render and sets them inline on the <li>, overriding these;
       when no tag wins it CLEARS those inline properties rather than writing a
       hardcoded pair, so this rule is the single owner of the default look.
       (Before step 14 these same two values were the fallback hardcoded in
       render.js, read off a stored per-task `colors` field that nothing reads
       anymore.)
       flex-wrap lets the note row (flex-basis: 100%, below) drop onto its
       own line under the checkbox+title row instead of squeezing into it. */
    li.task-item {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      margin: 5px 0;
      color: #ffffff;
      background-color: #3b82f6;
      /* Depth comes from taskTree.js's depthOf, set as a custom property by
         render.js (li.style.setProperty("--depth", depth)) — this is the
         only place the number becomes a visual indent. */
      margin-left: calc(var(--depth, 0) * 24px);
      border-radius: 4px;
      font-family: sans-serif;
    }
    .task-item--completed .task-item__label {
      text-decoration: line-through;
      opacity: 0.7;
    }
    /* Step 19 (S19-4): a task showing only as ANCESTOR CONTEXT for a
       matching descendant, not itself a match. Dims the whole row (unlike
       --completed, which only dims the label) so a glance across a mixed
       list of real matches and context rows tells the two apart
       immediately. The third `.task-item--*` modifier, joining --completed
       above and --reparent-target below. */
    .task-item--search-context {
      opacity: 0.5;
    }
    /* Step 20 (S20-9): the same dark-red #b91c1c the destructive tag-delete
       button already uses (below) — reused here rather than a new color so
       "this needs your attention" reads consistently across the app. */
    #search-error-message {
      color: #b91c1c;
      font-size: 13px;
      margin: 4px 0;
    }
    .task-item__label {
      cursor: text;
    }
    .task-item__title-input {
      flex: 1;
      min-width: 120px;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
    }
    /* Note row always spans the full width, indented to sit under the title
       rather than the checkbox. */
    .task-item__note-display,
    .task-item__note-input {
      flex-basis: 100%;
      margin-left: 28px;
      font-size: 13px;
    }
    .task-item__note-display {
      cursor: text;
      white-space: pre-wrap;
      opacity: 0.9;
    }
    .task-item__note-display a {
      color: inherit;
      text-decoration: underline;
    }
    .task-item__note-placeholder {
      font-style: italic;
      opacity: 0.6;
    }
    .task-item__note-input {
      width: calc(100% - 28px);
      min-height: 40px;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      font-family: inherit;
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
      resize: vertical;
    }
    /* Step 13 (Dates): the due-date + age row, same full-width/indented
       pattern as the note row above, one line below it. */
    .task-item__meta {
      flex-basis: 100%;
      margin-left: 28px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      opacity: 0.85;
    }
    .task-item__due-display {
      cursor: text;
    }
    /* D3: overdue is a distinct, attention-getting state — never applied to
       a task due today or in the future (isOverdueTask, render.js). */
    .task-item__due-display--overdue {
      color: #fca5a5;
      font-weight: 600;
    }
    .task-item__due-input {
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: inherit;
      background-color: rgba(255, 255, 255, 0.15);
    }
    .task-item__age {
      opacity: 0.75;
    }
    /* Step 15 (Q6): the resolved-quadrant badge — compact by design, the full
       wording lives in its `title` attribute (a native tooltip on hover), not
       in this pill's text. Sits in the same flex-wrap meta row as due-date/age
       so it never disturbs an RTL title above it; hidden entirely (display:
       none, set in render.js) for an unranked task rather than shown empty. */
    /* Step 18 (Recurrence): same compact-pill shape reused for the recurrence
       badge below — hidden entirely (display: none, set in render.js) for a
       non-recurring task rather than shown empty, same as the quadrant badge. */
    .task-item__quadrant-badge,
    .task-item__recurrence-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background-color: rgba(255, 255, 255, 0.25);
    }
    /* Step 22: the "⋯" affordance — a real <button>, not a span, so it is
       natively focusable/keyboard-activatable rather than needing its own
       tabindex/role/keydown handling. Base look mirrors the drag handle
       below (transparent background, inherited row color, similar font-size/
       padding) since the two sit side by side and read as one family of
       compact row-level icon buttons. Replaces the old always-visible
       "+ Subtask"/"Delete" per-row buttons this step removes — every action
       they offered now lives in the one context menu below, reached through
       this single affordance instead of two dedicated buttons. */
    .task-item__menu-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 0 4px;
    }
    /* Hidden by default, revealed on hover — the first hover-reveal pattern
       in this file. `opacity`, never `display: none`: toggling display would
       reflow the row (every element to its right shifting by the button's
       width) the instant the mouse arrives, which a mere hover should never
       do. Scoped to `(hover: hover)` so a touch device — which has no hover
       state to reveal it FROM — instead shows it unconditionally; there is
       no gesture on such a device that would ever flip opacity back to 1
       otherwise. */
    @media (hover: hover) {
      .task-item__menu-btn {
        opacity: 0;
      }
      li.task-item:hover .task-item__menu-btn {
        opacity: 1;
      }
    }
    /* Outside the media query so Tab-focusing the button reveals it even on
       a device with no hover support — keyboard reachability must never
       depend on hover capability. */
    .task-item__menu-btn:focus-visible {
      opacity: 1;
    }
    /* Fix 4 (dedupe): every section heading in this app — Focus (in the
       main view) and the three standalone screens (Trash/Overdue/Settings) —
       shares this exact rule. Grouped into one selector instead of five
       byte-identical copies; each `#foo h2` occurrence below this point was
       one of those copies. */
    #focus-section h2,
    #trash-view h2,
    #overdue-view h2,
    #settings-view h2 {
      font-size: 16px;
      margin-bottom: 4px;
    }
    /* Step 12: Focus — pinned tasks, flat (render.js's renderTasks flat
       branch), sitting above My Tasks (D8: it's the "what am I working on
       now" view). `hidden` (toggled by app.js's renderMainView) means no
       empty heading takes up space when nothing is pinned. Rows reuse the
       exact same .task-item markup/styling as the main list — a pinned row
       looks identical whether you're looking at its Focus copy or its
       normal-place copy. */
    #focus-section {
      padding-bottom: 8px;
      border-bottom: 1px solid #d1d5db;
      margin-bottom: 8px;
    }
    /* Step 8: the task context menu — one element for the whole app, moved
       and re-labeled per open rather than rebuilt. It lives outside both
       <ul>s (it's a sibling of #task-section entirely) so render.js's keyed
       re-render, which only ever touches li's inside those lists, can never
       tear it down while it's open. `display: none` is the resting state;
       `:not([hidden])` promotes it to flex only while app.js has it open,
       since a bare `.task-menu { display: flex }` would tie in specificity
       with the browser's own `[hidden] { display: none }` rule and could
       lose depending on stylesheet order. */
    .task-menu {
      position: fixed;
      display: none;
      flex-direction: column;
      min-width: 170px;
      background-color: #1f2937;
      color: #f9fafb;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      padding: 4px;
      z-index: 1000;
    }
    .task-menu:not([hidden]) {
      display: flex;
    }
    .task-menu__item {
      background: none;
      border: none;
      color: inherit;
      text-align: left;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
    }
    .task-menu__item:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }
    .task-menu__item--danger {
      color: #fca5a5;
    }
    /* Step 22: the menu's first separator — divides the new top group (the
       most common single-task actions, reached from the "⋯" button and the
       long-press/right-click gesture alike) from the pre-existing item list
       below it. A plain 1px line in the menu's own dark palette, not a full
       <hr> — a `<div role="separator">` keeps the exact same box-model
       control the surrounding flex column of buttons already has. */
    .task-menu__separator {
      height: 1px;
      margin: 4px 6px;
      background-color: rgba(255, 255, 255, 0.15);
    }
    /* Fix (product-spec.md:70-75): the "Move under…" picker — a `.task-menu`
       (so it inherits that class's box/position/`:not([hidden])` rules
       wholesale) plus its own two additions: a small caption, and a
       scrollable inner region so a large task list's candidate buttons don't
       grow the picker off-screen instead of scrolling within it. Candidate
       buttons themselves reuse `.task-menu__item` verbatim (app.js sets both
       classes) — same look, no second button style to keep in sync. */
    .move-picker {
      min-width: 220px;
      max-width: 320px;
    }
    .move-picker__title {
      padding: 6px 12px 4px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0.7;
    }
    .move-picker__list {
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      max-height: 260px;
    }
    .move-picker__item {
      width: 100%;
    }
    .move-picker__empty {
      padding: 8px 12px;
      font-size: 13px;
      opacity: 0.7;
      margin: 0;
    }
    /* Step 10: the per-row drag handle. `touch-action: none` is load-bearing,
       not decorative — without it, a touch device's own scroll gesture can
       win the pointer sequence away from our pointermove handler before a
       drag ever gets a chance to start (see render.js's createTaskElement
       comment). */
    .task-item__drag-handle {
      cursor: grab;
      touch-action: none;
      padding: 0 4px;
      font-size: 16px;
      line-height: 1;
      user-select: none;
      opacity: 0.7;
    }
    .task-item__drag-handle:active {
      cursor: grabbing;
    }
    /* The shared drop-indicator line (app.js creates and moves ONE instance
       of this, the same "single element, moved not rebuilt" pattern as
       .task-menu above) — `pointer-events: none` so it can never itself
       become the element under the pointer mid-drag and confuse the
       sibling-vs-indicator check in app.js's updateDragTarget. */
    .drop-indicator {
      height: 3px;
      margin: 2px 0;
      background-color: #3b82f6;
      border-radius: 2px;
      list-style: none;
      pointer-events: none;
    }
    /* Step 16 (R5): this exact gap crosses a quadrant-rank boundary — still a
       real, droppable target (the write still lands on release), but it will
       NOT visually hold once priority order re-sorts the list. Styled with
       the same orange product-spec.md's "make an overruled action visible"
       language already uses for .task-item--reparent-target below, dashed
       rather than solid so "will not hold" reads differently from the plain
       blue line even at a glance, before the user ever releases. */
    .drop-indicator--overruled {
      background-color: transparent;
      background-image: repeating-linear-gradient(90deg, #f59e0b 0 8px, transparent 8px 14px);
      border-radius: 0;
    }
    /* Step 11: the reparent target highlight. `drop-indicator` above marks an
       INSERTION POINT between two rows (a line); this marks a ROW ITSELF as
       "drop here to become my child" (D2's middle-50%-of-the-row zone), so it
       has to look different from the line, not reuse it. `outline` (not
       `border`) so it never shifts the row's own layout/height the way a
       border would, which would itself change where the 25/50/25 zone
       boundaries fall on the very next pointermove. */
    .task-item--reparent-target {
      outline: 3px solid #f59e0b;
      outline-offset: -3px;
    }
    /* Step 9: the Trash view. Reuses the app's existing color language
       (danger red for the destructive framing) rather than inventing a new
       one. */
    /* Fix 4 (dedupe): the "N of cap" byline under each of the three standalone
       screens' headings — Trash, Overdue, Settings — shares this exact rule;
       `#overdue-count`/`#settings-count` below used to repeat it verbatim. */
    #trash-count,
    #overdue-count,
    #settings-count {
      font-size: 13px;
      color: #6b7280;
      margin: 4px 0 12px;
    }
    li.trash-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      background-color: #e5e7eb;
      color: #1f2937;
    }
    .trash-item__label {
      flex: 1;
      word-break: break-word;
    }
    .trash-item__restore-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #3b82f6;
      color: white;
      flex-shrink: 0;
    }
    #trash-btn {
      background-color: #6b7280;
      color: white;
      margin: 8px 0;
    }
    /* Fix 4 (dedupe): the "← Back" button on all three standalone screens
       shares this exact rule too — `#overdue-back-btn`/`#settings-back-btn`
       below used to repeat it verbatim. */
    #trash-back-btn,
    #overdue-back-btn,
    #settings-back-btn {
      background-color: #6b7280;
      color: white;
      margin-bottom: 8px;
    }
    /* Step 13 (Dates, D4): the Overdue screen — a third view panel, styled
       like Trash's (same button color language) since it's the same kind of
       "step out of the main view into a dedicated screen" pattern. */
    #overdue-btn {
      background-color: #b45309;
      color: white;
      margin: 8px 0;
    }
    /* Step 14 (Tag colors, D4): the Tag Settings screen — a fourth view panel,
       styled like Trash's and Overdue's for the same reason they match each
       other: it is the same "step out of the main view into a dedicated
       screen" pattern, not a new one. Step 15 adds a quadrant control to each
       row here; the row is a flex line precisely so that is one more child,
       not a re-layout. */
    #settings-btn {
      background-color: #4b5563;
      color: white;
      margin: 8px 0;
    }
    /* Step 17: the single in-memory undo affordance — an amber warning color
       (distinct from every other button here) so it reads as "time-limited",
       matching its own honest "lost on reload" label. */
    #settings-undo-btn {
      display: block;
      background-color: #b45309;
      color: white;
      font-size: 13px;
      padding: 6px 10px;
      margin: 0 0 12px;
    }
    li.tag-setting {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      margin: 5px 0;
      border-radius: 4px;
      background-color: #e5e7eb;
      color: #1f2937;
    }
    /* The tag rendered in its own assigned colors — the row's preview, so the
       pair is visible here without hunting for a task that carries the tag.
       render.js sets color/background inline when the tag HAS colors; the
       --unset modifier below is what an uncolored tag looks like instead. */
    .tag-setting__preview {
      flex: 1;
      min-width: 90px;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-word;
    }
    .tag-setting__preview--unset {
      border: 1px dashed #9ca3af;
      opacity: 0.75;
    }
    .tag-setting__field {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #374151;
    }
    /* `input` above is styled at 70% width for the add-task box; a color swatch
       has to opt out of that or it takes the whole row. */
    .tag-setting__color {
      width: 36px;
      height: 26px;
      padding: 0;
      border: 1px solid #9ca3af;
      border-radius: 4px;
      background: none;
      cursor: pointer;
    }
    .tag-setting__clear-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #6b7280;
      color: white;
      flex-shrink: 0;
    }
    /* Step 15: the quadrant <select>, one more field in the same flex row —
       PROGRESS.md's own note on this being "one more child, not a rewrite". */
    .tag-setting__quadrant {
      font-size: 12px;
      padding: 3px 4px;
      border-radius: 4px;
      border: 1px solid #9ca3af;
      background-color: white;
      color: #1f2937;
    }
    /* Step 17: Rename/Delete — two separate destructive-ish actions (see
       render.js's comment on why they're not one toggle), styled apart from
       "Clear colors" (which only ever touches colors, never the tag itself)
       so the two very different blast radii read differently at a glance. */
    .tag-setting__rename-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #2563eb;
      color: white;
      flex-shrink: 0;
    }
    .tag-setting__delete-btn {
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      background-color: #b91c1c;
      color: white;
      flex-shrink: 0;
    }
    /* Step 21 (S21-9): Export/Import — two more static controls on this same
       screen, styled apart from the per-tag rows below them (a margin gap,
       not a border) since they act on the whole account, not one tag. */
    #data-portability {
      display: flex;
      gap: 8px;
      margin: 4px 0 16px;
    }
    #export-btn,
    #import-btn {
      background-color: #0f766e;
      color: white;
      font-size: 13px;
      padding: 6px 10px;
    }
  </style>
</head>
<body>
  <h1>Todo Manager</h1>
  
  <div id="auth-section">
    <p id="user-status">Checking status...</p>
    <button id="login-btn" style="display: none;">Login with Google</button>
    <button id="logout-btn" style="display: none;">Logout</button>
  </div>

  <!-- Interactive task UI section. Step 9 splits this into two mutually
       exclusive panels — #main-view and #trash-view — switched by app.js's
       `currentView` string and `views` dispatch object. This is deliberately
       NOT a router (no hash change, no history entry): the plan calls for
       "a currentView string plus that dispatch object", nothing more, since
       the app has exactly two screens and no need for back/forward or a
       bookmarkable URL per screen. -->
  <div id="task-section" style="display: none; margin-top: 20px;">
    <div id="main-view">
      <form id="task-form">
        <input
          type="text"
          id="task-input"
          dir="auto"
          placeholder="Add task (e.g., Buy groceries #food @shop)"
          required
        />
        <button type="submit">Add Task</button>
      </form>
      <label class="show-completed-toggle">
        <input type="checkbox" id="show-completed-toggle" />
        Show completed
      </label>
      <!-- Step 19 (Search — basic, S19-0): a FILTER over this same main-view
           render, never a separate view/screen — see app.js's renderMainView
           for why (Focus/pinning/drag/quadrant sort would all have to
           be reimplemented for a standalone "search" screen). Every
           keystroke re-renders (S19-7: no debounce, see app.js); Escape
           clears it (S19-8, app.js's #search-input keydown branch). -->
      <input
        type="text"
        id="search-input"
        dir="auto"
        placeholder="Search (e.g. urgent #private @office)"
      />
      <button type="button" id="trash-btn">Trash</button>
      <!-- Step 13 (D1/D4): opens the Overdue screen — see #overdue-view
           below for why this is a separate VIEW (Trash's precedent), not a
           section folded into this main view the way Focus is. -->
      <button type="button" id="overdue-btn">Overdue</button>
      <!-- Step 14 (D4): opens the Tag Settings screen — see #settings-view
           below. Step 15's quadrant mapping shares this same screen. -->
      <button type="button" id="settings-btn">Tag settings</button>

      <!-- Step 19 (S19-9): replaces the My Tasks/Focus lists' content
           (never a silently empty container, which would be
           indistinguishable from a data-loss bug at a glance) when the
           search box holds an actual query and it matches nothing at all.
           An EMPTY box with zero tasks is a different, correctly silent
           state — "you have no tasks" — so app.js's renderMainView only
           un-hides this when the trimmed query is non-empty. -->
      <p id="search-empty-message" hidden>No tasks match</p>

      <!-- Step 20 (S20-9): a parse error (e.g. mid-keystroke on `#a AND `)
           never blanks the list — app.js's renderMainView shows the full
           unfiltered list and un-hides this instead, right beside the box
           it's reporting on. Never a stack trace: the text is always one
           of the plain-English messages searchQuery.js's parser throws
           ("expected a term after AND", "unbalanced parenthesis", ...). -->
      <p id="search-error-message" hidden></p>

      <!-- Step 12 (D1/D8): Focus — pinned tasks, hand-picked (D2: flat, no
           subtree pulled in), sorted by the same comparator as the main list
           (D3). `hidden` by default; app.js's renderMainView toggles it based
           on whether anything is pinned, so an empty Focus never shows an
           empty heading above My Tasks. Sits ABOVE My Tasks — it's the
           "what am I working on right now" view, per the spec. -->
      <section id="focus-section" hidden>
        <h2>Focus</h2>
        <ul id="focus-list"></ul>
      </section>

      <h2>My Tasks</h2>
      <ul id="task-list"></ul>
    </div>

    <!-- Step 9: the Trash — a FLAT list ordered newest-deleted-first (never
         a tree; see render.js's renderTrash comment for why), with a count
         against the 50-item cap and a per-row Restore button. Nested inside
         #task-section (not a sibling of it) so it shares that element's
         existing delegated listeners instead of needing its own set — a
         trash row's <li> carries `dataset.taskId` just like a main-list row,
         so app.js's click delegation can recognize `.trash-item__restore-btn`
         the same way it recognizes the main list's per-row buttons. -->
    <div id="trash-view" hidden>
      <button type="button" id="trash-back-btn">← Back</button>
      <h2>Trash</h2>
      <p id="trash-count"></p>
      <ul id="trash-list"></ul>
    </div>

    <!-- Step 13 (D1/D4): the Overdue screen — a SCREEN following #trash-view's
         exact precedent above (a currentView value + app.js's dispatch
         table), deliberately NOT a section folded into #main-view the way
         #focus-section is. Rows are flat and full-width (render.js's
         renderOverdue reuses the exact same createTaskElement/
         updateTaskElement pipeline the main list and Focus use — checkbox,
         title/note/due-date inline edit, drag handle, buttons — never
         #trash-view's simpler label-plus-button shape), never a tree, and
         never pull in a non-overdue parent or child (D4). Nested inside
         #task-section for the same reason #trash-view is: sharing its
         existing delegated listeners instead of needing a second set. -->
    <div id="overdue-view" hidden>
      <button type="button" id="overdue-back-btn">← Back</button>
      <h2>Overdue</h2>
      <p id="overdue-count"></p>
      <ul id="overdue-list"></ul>
    </div>

    <!-- Step 14 (D4): the Tag Settings screen — a SCREEN following
         #trash-view/#overdue-view's exact precedent (a currentView value +
         app.js's dispatch table), deliberately not a fourth navigation
         pattern. Rows are keyed by TAG NAME (`data-tag-name`), not task id:
         a tag is not a task, so these rows share none of the task row's shape
         (no checkbox, no inline title/note/due editor, no drag handle, no
         depth). Nested inside #task-section for the same reason the other two
         screens are — it reaches app.js's existing delegated change/click
         listeners instead of needing its own set. Per product-spec.md §7 this
         is also where step 15's quadrant assignment lands: one screen owns
         everything about a tag. -->
    <div id="settings-view" hidden>
      <button type="button" id="settings-back-btn">← Back</button>
      <h2>Tag settings</h2>
      <p id="settings-count"></p>
      <!-- Step 17 (S17-1): a single in-memory undo slot for the last tag
           rename/delete — hidden whenever nothing is undoable. Its own label
           says "lost on reload" so the affordance never implies a durable
           history this app doesn't have (there is no operation log; this is
           scoped to exactly this one action per PROGRESS.md's Decisions). -->
      <button type="button" id="settings-undo-btn" hidden></button>
      <!-- Step 20 (S20-8): "this week" has no universal meaning, so the
           first day of the week is a per-user setting living on this same
           screen (there is no other settings surface in this app) — one
           <select>, not per-row, so it lives outside the per-tag rows
           `#settings-list` renders. Options are the literal `'sunday'`/
           `'monday'` strings `isValidSettings()` (firestore.rules) already
           accepts — see app.js's `updateWeekStart`. Defaults to Sunday
           (S20-8's documented default) both here and when the field is
           entirely absent from a settings document that predates step 20. -->
      <label for="week-start-select">Week starts on</label>
      <select id="week-start-select">
        <option value="sunday">Sunday</option>
        <option value="monday">Monday</option>
      </select>
      <!-- Step 21 (S21-9): the two Data Portability actions — plain buttons
           on this existing screen (there is no other settings surface in
           this app), not a new view. Export needs no confirm dialog (it's
           read-only); Import's confirm dialog lives in app.js's file-input
           change handler, only once the chosen file has actually been read
           and validated (S21-5/S21-7 — the dialog can only ever offer an
           operation that CAN fully succeed, same as step 17's rename/delete
           precedent). `#import-file-input` is hidden and triggered by
           `#import-btn`'s click (app.js's handleImportClick) rather than
           shown directly, so the control reads like every other button here
           instead of a bare, unstyled native file picker. -->
      <div id="data-portability">
        <button type="button" id="export-btn">Export to JSON file</button>
        <button type="button" id="import-btn">Import from JSON file</button>
        <input type="file" id="import-file-input" accept="application/json" hidden />
      </div>
      <ul id="settings-list"></ul>
    </div>
  </div>

  <!-- Step 8: the task context menu (right-click or long-press on a row).
       Deliberately OUTSIDE #task-section's lists — see the .task-menu CSS
       comment above for why. `data-task-id` is set by app.js when it opens;
       every item routes to the exact same handler functions the existing
       inline per-row buttons call — there is no separate menu-only
       implementation of any of these. -->
  <div id="task-menu" class="task-menu" hidden>
    <!-- Step 22: the top group — the actions most tasks need most often,
         reachable from the new "⋯" button as well as the pre-existing
         long-press/right-click gesture. Label flips per current state in
         openTaskMenuForTask, same toggle-label shape "Pin to Focus"/"Unpin
         from Focus" below already uses. -->
    <button type="button" class="task-menu__item" data-action="mark-complete">Mark as completed</button>
    <!-- Step 22: opens the same inline note editor a direct click on the
         note display already does (beginEdit/beginNoteEdit,
         handleAddNoteMenuClick in app.js) — no separate "add note" write
         path of its own. -->
    <button type="button" class="task-menu__item" data-action="add-note">Add note</button>
    <!-- Step 13 (D10), moved into this new top group by step 22: "Set due
         date"/"Change due date" always opens the inline `<input
         type="date">` editor on the row the menu was opened for (label
         toggles per whether a due date already exists — see
         openTaskMenuForTask below, which overwrites this button's text on
         every open; the "Add due date" text below is only ever the
         pre-first-open default). -->
    <button type="button" class="task-menu__item" data-action="edit-due-date">Add due date</button>
    <!-- Step 22: single task only — children stay with the original, never
         copied. Copies title/note/due date, recomputes tags from the copied
         title, resets pinned/completed, and omits recurrence entirely — see
         handleDuplicateClick's own comment in app.js for the full
         field-by-field rule. -->
    <button type="button" class="task-menu__item" data-action="duplicate">Duplicate</button>
    <!-- Step 22: reparents onto the previous RENDERED sibling, landing as its
         last child. Hidden when there is no previous rendered sibling to
         become the new parent — see openTaskMenuForTask below. -->
    <button type="button" class="task-menu__item" data-action="indent-in">Indent inside</button>
    <!-- Step 22: reparents onto the current parent's own parent (may be
         root) — a promote-one-level move. Hidden for a task that's already
         at the root, the same predicate "Move to top level" below already
         uses. -->
    <button type="button" class="task-menu__item" data-action="indent-out">Indent outside</button>
    <button type="button" class="task-menu__item task-menu__item--danger" data-action="delete">Delete</button>
    <!-- Step 22: divides the top group above (the actions most tasks need
         most often) from the pre-existing, more situational item list
         below. -->
    <div class="task-menu__separator" role="separator"></div>
    <!-- Step 4: add a subtask under this task. This context-menu item is now
         the only way to reach this action — step 22 removed the row's own
         always-visible "+ Subtask" button that used to sit alongside it. -->
    <button type="button" class="task-menu__item" data-action="add-subtask">Add subtask</button>
    <!-- Step 11 (D9): the promote-to-root move drag can't express — there is
         no row to drop a task onto for "no parent". Shown only for a task
         that currently HAS a parent (app.js's openTaskMenuForTask toggles
         this per open). Routes through the exact same reparent handler the
         drag-drop path uses (performReparent in app.js), not a parallel
         implementation. -->
    <button type="button" class="task-menu__item" data-action="move-to-top">Move to top level</button>
    <!-- Fix (product-spec.md:70-75): a precise-drag-free way to reparent onto
         a SPECIFIC other task, not just the root "move-to-top" reaches above
         — "the whole hierarchy stays reachable on a touch screen without a
         precise drag." Always offered (unlike "Move to top level", which
         hides for a task that's already a root — there's always some other
         valid destination to browse to, and the picker's own empty state
         covers the rare task with none). Opens #move-picker (app.js's
         openMovePicker); the actual write still goes through the one
         performReparent function every other reparent path already uses. -->
    <button type="button" class="task-menu__item" data-action="move-under">Move under…</button>
    <!-- Step 12 (D7): pin/unpin a task into Focus — context-menu only, no
         inline per-row button, same pattern as "Move to top level" above.
         Label text and hidden/shown state are set per-open by app.js's
         openTaskMenuForTask (hidden for a completed task — only an open task
         can be "what I'm working on now"). Routes through the one shared
         handleTogglePinClick/enqueueMutation-wrapped saveTask, not a
         parallel implementation. -->
    <button type="button" class="task-menu__item" data-action="toggle-pin">Pin to Focus</button>
    <!-- Step 18 (Recurrence, S18-0/D10 precedent): a single prompt-based
         editor (app.js's handleSetRecurrenceClick), label toggled per
         whether a rule is already set. There is deliberately NO separate
         "Stop recurrence" item — product-spec.md §5:145-148 rules that out
         explicitly (deleting the task is what ends a cycle); the editor's
         own "none" answer is how a misconfigured rule gets corrected. -->
    <button type="button" class="task-menu__item" data-action="set-recurrence">Set recurrence</button>
    <!-- Step 13 (D10): a one-shot write with no editor step, shown only when
         task.dueDate is set. Moved below the separator with the other
         secondary/situational actions. -->
    <button type="button" class="task-menu__item" data-action="clear-due-date">Clear due date</button>
  </div>

  <!-- Fix (product-spec.md:70-75): the "Move under…" candidate picker —
       a second floating panel, opened from #task-menu's own item above,
       styled as `.task-menu` too (same "one shared element, moved and
       re-labeled per open" pattern, same floating-list look) but a SEPARATE
       element, because its content (a task-id-keyed list of titles built
       fresh per open) is nothing like the menu's fixed action list.
       `#move-picker-list` is populated by app.js's openMovePicker with one
       button per valid destination — every task except this one, its own
       descendants (a cycle), and anything too deep for the moved subtree to
       fit under (the 7-level cap) — plus a leading "Top level" choice.
       `dir="auto"` is set per-button in app.js, exactly as render.js:570
       does for every other element that shows a task title. -->
  <div id="move-picker" class="task-menu move-picker" hidden>
    <div class="move-picker__title">Move under…</div>
    <div id="move-picker-list" class="move-picker__list"></div>
  </div>

  <!-- Pointing to our main orchestration file -->
  <script type="module" src="./app.js"></script>
</body>
</html>
